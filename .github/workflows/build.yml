name: Build and verify ComfyUI image
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jupyter-server==2.21.1 pyyaml websocket-client
      - name: Validate startup, authentication and persistence before CUDA build
        run: |
          python test_lazy_cache.py
          python test_runpoddirect.py
          python test_preflight.py
          python test_deploy_runpod.py
  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Make room for CUDA image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Build image locally for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: comfy-global:test
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=min
      - name: Test interfaces and persistence after replacing the container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint bash comfy-global:test -lc \
            'test "$CC" = /usr/bin/gcc; printf "int main(void){return 0;}\n" | "$CC" -x c - -o /tmp/compiler-test; /tmp/compiler-test'
          mkdir -p "$RUNNER_TEMP/comfy-volume"
          docker run -d --name smoke -e COMFY_CPU_TEST=1 -e RUNPOD_POD_ID=example -e JUPYTER_TOKEN=test-token -e JUPYTER_PASSWORD=test-token -v "$RUNNER_TEMP/comfy-volume:/workspace" -p 8188:8188 -p 8888:8888 comfy-global:test
          trap 'docker logs smoke; docker rm -f smoke || true' EXIT
          for i in $(seq 1 90); do
            test "$(docker inspect -f '{{.State.Running}}' smoke)" = true || exit 1
            if curl --fail --silent http://localhost:8188/system_stats >/tmp/stats.json; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:8188/system_stats
          test "$(curl --fail --silent http://localhost:8188/v2/manager/version)" = "V4.2.2"
          curl --fail --silent http://localhost:8188/features | python3 -c 'import json,sys; assert json.load(sys.stdin)["extension"]["manager"]["supports_v4"] is True'
          curl --fail --silent http://localhost:8188/v2/manager/channel_url_list | python3 -c 'import json,sys; assert any(x.startswith("default::") for x in json.load(sys.stdin)["list"])'
          curl --fail --silent http://localhost:8188/server_download/status | python3 -c 'import json,sys; assert json.load(sys.stdin) == {}'
          curl --fail --silent http://localhost:8188/server_download/folder_paths | python3 -c 'import json,sys; assert json.load(sys.stdin)["checkpoints"][0] == "/workspace/ComfyUI/models/checkpoints"'
          curl --fail --silent http://localhost:8188/extensions/ComfyUI-RunpodDirect/serverDownload.js | grep -q 'Download to Pod'
          curl --fail --silent http://localhost:8188/server_download/cgroup_ram_patch_status | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["enabled"] is False and d["applied"] is False and d["settings_file"] == "/workspace/.comfy-image/runpoddirect-settings.json"'
          test "$(curl --silent -o /tmp/rejected.json -w '%{http_code}' -X POST http://localhost:8188/server_download/start -H 'Content-Type: application/json' -d '{"url":"http://127.0.0.1/private","save_path":"checkpoints","filename":"blocked.safetensors"}')" = 400
          test "$(curl --silent -o /tmp/traversal.json -w '%{http_code}' -X POST http://localhost:8188/server_download/start -H 'Content-Type: application/json' -d '{"url":"https://example.com/model","save_path":"checkpoints","filename":"../escape.safetensors"}')" = 400
          curl --fail --silent -X POST http://localhost:8188/server_download/keepalive -H 'Content-Type: application/json' -d '{"enabled":false}' | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["success"] is True and d["enabled"] is False'
          test -s "$RUNNER_TEMP/comfy-volume/.comfy-image/runpoddirect-settings.json"
          curl --fail --silent 'http://localhost:8888/api/status?token=test-token' -H 'Host: example-8888.proxy.runpod.net'
          curl --fail --silent 'http://localhost:8888/lab?token=test-token' >/dev/null
          test "$(curl --silent -o /dev/null -w '%{http_code}' -H 'Accept: application/json' http://localhost:8888/api/status)" = 403
          curl --fail --silent -X PUT 'http://localhost:8888/api/contents/persistence-test.txt?token=test-token' -H 'Content-Type: application/json' -d '{"type":"file","format":"text","content":"saved across Pods"}' >/dev/null
          test -d "$RUNNER_TEMP/comfy-volume/ComfyUI/models"
          docker stop -t 60 smoke
          docker rm smoke
          docker run -d --name smoke -e COMFY_CPU_TEST=1 -e RUNPOD_POD_ID=example -e JUPYTER_TOKEN=test-token -e JUPYTER_PASSWORD=test-token -v "$RUNNER_TEMP/comfy-volume:/workspace" -p 8188:8188 -p 8888:8888 comfy-global:test
          for i in $(seq 1 90); do
            test "$(docker inspect -f '{{.State.Running}}' smoke)" = true || exit 1
            if curl --fail --silent http://localhost:8188/system_stats >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:8188/system_stats
          test "$(curl --fail --silent http://localhost:8188/v2/manager/version)" = "V4.2.2"
          curl --fail --silent http://localhost:8188/server_download/keepalive_status | python3 -c 'import json,sys; assert json.load(sys.stdin)["enabled"] is False'
          curl --fail --silent 'http://localhost:8888/api/status?token=test-token'
          curl --fail --silent 'http://localhost:8888/api/contents/persistence-test.txt?token=test-token' | python3 -c 'import json,sys; assert json.load(sys.stdin)["content"] == "saved across Pods"'
          docker stop -t 60 smoke
          test -s "$RUNNER_TEMP/comfy-volume/.comfy-image/comfyui-current.db"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag comfy-global:test "$IMAGE:comfy0.38.0-cuda13.0-v8"
          docker tag comfy-global:test "$IMAGE:latest"
          docker push "$IMAGE:comfy0.38.0-cuda13.0-v8"
          docker push "$IMAGE:latest"
